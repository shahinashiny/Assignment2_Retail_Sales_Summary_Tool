  <text class="num" x="466.94112531110994" y="440" text-anchor="end" style="fill:#fff">816,024</text>
<rect class="panel" x="632" y="153" width="520" height="400" rx="18"/>
 <text x="656" y="194" font-size="19" font-weight="800">Total Profit</text><line class="axis" x1="778" y1="218" x2="778" y2="470"/><text class="small" x="778" y="493" text-anchor="middle">0.0K</text><line class="axis" x1="850.5" y1="218" x2="850.5" y2="470"/><text class="small" x="850.5" y="493" text-anchor="middle">40.0K</text><line class="axis" x1="923" y1="218" x2="923" y2="470"/><text class="small" x="923" y="493" text-anchor="middle">80.0K</text><line class="axis" x1="995.5" y1="218" x2="995.5" y2="470"/><text class="small" x="995.5" y="493" text-anchor="middle">120.0K</text><line class="axis" x1="1068" y1="218" x2="1068" y2="470"/><text class="small" x="1068" y="493" text-anchor="middle">160.0K</text><text class="label" x="656" y="257">Furniture</text>
  <rect x="778" y="235" width="290" height="26" rx="7" fill="#eef2f7"/>
  <rect x="778" y="235" width="31.530515168749954" height="26" rx="7" fill="url(#profit)"/>
  <text class="num" x="819.53051516875" y="254" text-anchor="start" style="">17,396</text><text class="label" x="656" y="350">Office Supplies</text>
  <rect x="778" y="328" width="290" height="26" rx="7" fill="#eef2f7"/>
