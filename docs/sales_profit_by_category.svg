  <rect x="778" y="421" width="254.4507010812498" height="26" rx="7" fill="url(#profit)"/>
  <text class="num" x="1042.45070108125" y="440" text-anchor="end" style="fill:#fff">140,387</text>
<text x="48" y="590" class="small">Note: each panel uses its own scale so smaller profit bars remain visible alongside much larger sales values.</text>
