<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Sales and profit by category</title>
<desc id="desc">Bar charts of cleaned sales and profit totals for Furniture, Office Supplies, and Technology.</desc>
<defs>
  <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0f9f9a"/><stop offset="100%" stop-color="#25c2b0"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop offset="0%" stop-color="#4778d0"/><stop offset="100%" stop-color="#7c6ce3"/></linearGradient>
  <linearGradient id="profit" x1="0" x2="1"><stop offset="0%" stop-color="#4387d8"/><stop offset="100%" stop-color="#6a9df3"/></linearGradient>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#1c2b43}
    .title{font-size:31px;font-weight:800;letter-spacing:-.6px}
    .subtitle{font-size:15px;fill:#5b6b82}
    .small{font-size:12px;fill:#65758b}
    .label{font-size:16px;font-weight:600}
    .num{font-size:15px;font-weight:700}
    .axis{stroke:#dfe6ef;stroke-width:1}
    .panel{fill:#ffffff;stroke:#e1e8f1;stroke-width:1.2}
  </style>
</defs>
<rect width="1200" height="630" rx="22" fill="#f4f7fb"/>
<text x="48" y="56" class="title">Sales &amp; Profit by Category</text>
<text x="48" y="86" class="subtitle">Aggregated from rows with valid Sales and Profit values; text whitespace normalized before grouping.</text>
<rect x="48" y="107" width="350" height="28" rx="14" fill="#e6f5f4"/><text x="64" y="126" font-size="12" font-weight="700">Valid rows: 9,772</text>
<rect x="410" y="107" width="350" height="28" rx="14" fill="#e9efff"/><text x="426" y="126" font-size="12" font-weight="700">Total sales: 2.24M</text>
<rect x="772" y="107" width="380" height="28" rx="14" fill="#f0edff"/><text x="788" y="126" font-size="12" font-weight="700">Total profit: 278.0K</text>
<rect class="panel" x="48" y="153" width="520" height="400" rx="18"/>
 <text x="72" y="194" font-size="19" font-weight="800">Total Sales</text><line class="axis" x1="194" y1="218" x2="194" y2="470"/><text class="small" x="194" y="493" text-anchor="middle">0.0K</text><line class="axis" x1="266.5" y1="218" x2="266.5" y2="470"/><text class="small" x="266.5" y="493" text-anchor="middle">225.0K</text><line class="axis" x1="339" y1="218" x2="339" y2="470"/><text class="small" x="339" y="493" text-anchor="middle">450.0K</text><line class="axis" x1="411.5" y1="218" x2="411.5" y2="470"/><text class="small" x="411.5" y="493" text-anchor="middle">675.0K</text><line class="axis" x1="484" y1="218" x2="484" y2="470"/><text class="small" x="484" y="493" text-anchor="middle">900.0K</text><text class="label" x="72" y="257">Furniture</text>
  <rect x="194" y="235" width="290" height="26" rx="7" fill="#eef2f7"/>
  <rect x="194" y="235" width="233.6103166077778" height="26" rx="7" fill="url(#teal)"/>
  <text class="num" x="437.6103166077778" y="254" text-anchor="end" style="fill:#fff">724,998</text><text class="label" x="72" y="350">Office Supplies</text>
  <rect x="194" y="328" width="290" height="26" rx="7" fill="#eef2f7"/>
  <rect x="194" y="328" width="225.90455605555678" height="26" rx="7" fill="url(#teal)"/>
  <text class="num" x="429.9045560555568" y="347" text-anchor="end" style="fill:#fff">701,083</text><text class="label" x="72" y="443">Technology</text>
