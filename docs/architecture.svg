<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-labelledby="title desc">
<title id="title">Retail Sales Summary Tool architecture</title>
<desc id="desc">Local Python workflow from CSV input through data loading and cleaning to sales analysis and charts.</desc>
