<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Monthly sales trend</title>
<desc id="desc">Line chart showing monthly sales totals from the included retail dataset. Rows with invalid dates are excluded.</desc>
<defs>
  <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0f9f9a"/><stop offset="100%" stop-color="#25c2b0"/></linearGradient>
